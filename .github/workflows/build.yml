name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Select deployment theme
        id: theme
        shell: bash
        env:
          MANUAL_THEME: ${{ inputs.theme }}
          DEFAULT_THEME: electrical-notebook-black
        run: |
          selected_theme="$DEFAULT_THEME"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$MANUAL_THEME" ]]; then
            selected_theme="$MANUAL_THEME"
          fi

          echo "Selected theme: $selected_theme"
          echo "VITE_PORTFOLIO_THEME=$selected_theme" >> "$GITHUB_ENV"
          echo "theme=$selected_theme" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist
          if-no-files-found: error
          retention-days: 7